name: ci

# workflow_dispatch is the manual escape hatch: it lets a run be launched for
# a push whose commits would otherwise skip CI, without pushing another commit.
#
# push is filtered to the branches that are merge targets. Without the filter
# every push to a feature branch ran the whole pipeline AND the pull_request
# event ran it again on the same commit - measured at 21 jobs and ~95 billable
# minutes per run, so exactly double for no extra information. A branch with no
# pull request open is covered by `mdl ci <repo> --matrix` locally.
on:
  push:
    branches:
      - main
      - 'MOODLE_*_STABLE'
  pull_request:
  workflow_dispatch:

# Supersede a run when new commits arrive on the same pull request: pushing
# three fixes in a row otherwise leaves three full pipelines running to the end.
# Never on main - each merge there is the only run its commit will ever get, and
# a second merge landing quickly must not cancel the first one's verdict.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # One reusable-workflow call: the Moodle version this branch supports (version.php
  # $plugin->supported), with the full PHP x DB matrix. Every supported Moodle version has its
  # own MOODLE_<NNN>_STABLE branch with its own job here; keep each branch's job on a merge
  # between them. PHPUnit and Behat run on every runtime leg.
  #
  # The engine has no hard dependency. Its soft companions are installed so that the tests
  # needing them run instead of skipping: local_dictionaries from its branch for the same Moodle
  # version, customfield_pattern (Moodle 5.1 and later) from its one branch, main.
  ci-502:
    name: Moodle 5.02
    uses: uaiblaine/moodle-workflows/.github/workflows/moodle-plugin-ci.yml@main
    with:
      runner: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && vars.CI_RUNNER || '' }}
      moodle-core-branch: MOODLE_502_STABLE
      plugin-dependencies: |
        uaiblaine/moodle-local_dictionaries,MOODLE_502_STABLE
        uaiblaine/moodle-customfield_pattern,main
