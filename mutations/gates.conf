# Mutation spec for local_repeatable — run with
# `mdl mutate moodle-local_repeatable /Users/uaiblaine/dev/moodle-local_repeatable/mutations/gates.conf --fast --db pgsql`
# and again with `--db mariadb`.
#
# Each gate breaks ONE guard and names the test(s) that must go red because of it. A gate with no
# `->` line is one the author expects NO test (or no test on every database) to hold: its result is
# the finding, not a pass. Gates marked `# needs customfield_pattern` or `# needs local_dictionaries`
# are held by tests that skip without that companion: judge them from a leg that installs it (ci.yml
# installs both).
#
# These gates moved from profilefield_repeatable with the code they break (stages B1 and B2 of its
# docs/engine-extraction-design.md); the tags are the field's, so a sweep log of either repository
# reads against the other.
#
#     tag | file relative to the repo | perl script relative to this file

